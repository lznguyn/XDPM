_format_version: "3.0"
_transform: true

services:
  # ================== AUTH SERVICE ==================
  - name: auth-service
    url: http://auth-service:8081
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: auth-route
        paths:
          - /api/Auth
          - /api/Admin
          - /api/Customer
          - /api/Experts
          - /api/Studio
          - /api/Arrangement
          - /api/Specialist
          - /api/Notification
        strip_path: false
        preserve_host: true
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:8080
                - http://localhost:8082
                - http://localhost:8000
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-Type
                - Authorization
                - X-CSRF-Token
              exposed_headers:
                - X-Pagination-Total-Count
                - X-Pagination-Page-Count
              credentials: true
              max_age: 3600
          - name: request-termination
            enabled: false
          - name: response-transformer
            enabled: false

  # ================== COORDINATOR SERVICE ==================
  - name: coordinator-service
    url: http://coordinator-service:3000
