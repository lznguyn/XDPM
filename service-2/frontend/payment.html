<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - MuTraPro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .payment-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .amount-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .amount-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .amount-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .qr-section {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            text-align: center;
        }

        .qr-section.active {
            display: block;
        }

        .qr-code {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 15px 0;
        }

        .qr-code img {
            width: 200px;
            height: 200px;
        }

        .bank-info {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .bank-info div {
            margin-bottom: 8px;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        .message.success {
            background: #d3f9d8;
            color: #2f9e44;
            border-left: 4px solid #2f9e44;
        }

        .message.error {
            background: #ffe0e6;
            color: #c92a2a;
            border-left: 4px solid #c92a2a;
        }

        .message.info {
            background: #d0ebff;
            color: #1971c2;
            border-left: 4px solid #1971c2;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-card">
            <div class="header">
                <h1>💳 Thanh Toán</h1>
            </div>

            <div id="messageContainer"></div>

            <div class="amount-display">
                <div class="amount-label">Số tiền thanh toán</div>
                <div class="amount-value" id="amountDisplay">0 ₫</div>
            </div>

            <form id="paymentForm" onsubmit="processPayment(event)">
                <input type="hidden" id="orderId" />
                <input type="hidden" id="customerId" />
                <input type="hidden" id="amount" />

                <div class="form-group">
                    <label>Phương Thức Thanh Toán *</label>
                    <select id="paymentMethod" required onchange="handlePaymentMethodChange()">
                        <option value="">-- Chọn Phương Thức --</option>
                        <option value="BANK_TRANSFER">🏦 Chuyển Khoản Ngân Hàng (VietQR)</option>
                        <option value="CREDIT_CARD">💳 Thẻ Tín Dụng</option>
                        <option value="MOMO">💰 Ví Điện Tử (MoMo)</option>
                        <option value="CASH">💵 Tiền Mặt</option>
                    </select>
                </div>

                <div id="qrSection" class="qr-section">
                    <div style="font-weight: 600; margin-bottom: 15px; color: #333;">Quét mã QR để thanh toán</div>
                    <div class="qr-code">
                        <img id="qrCodeImage" src="" alt="QR Code" />
                    </div>
                    <div class="bank-info" id="bankInfo"></div>
                    <div class="warning">
                        ⚠️ Sau khi chuyển khoản, vui lòng nhấn "Xác nhận đã thanh toán" để hoàn tất
                    </div>
                </div>

                <div class="form-group">
                    <label>Tên Người Thanh Toán</label>
                    <input type="text" id="payerName" placeholder="Nhập tên" />
                </div>

                <button type="submit" class="btn btn-primary">
                    ✓ Xác Nhận Thanh Toán
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">
                    ✕ Hủy
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuration - Use Kong Gateway
        const API_BASE = 'http://localhost:8000/api/payments';
        const CUSTOMER_SERVICE_BASE = 'http://localhost:8000';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const customerId = urlParams.get('customerId');
        const amount = urlParams.get('amount');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (!orderId || !customerId || !amount) {
                showMessage('Thiếu thông tin thanh toán. Vui lòng quay lại.', 'error');
                return;
            }

            document.getElementById('orderId').value = orderId;
            document.getElementById('customerId').value = customerId;
            document.getElementById('amount').value = amount;
            document.getElementById('amountDisplay').textContent = formatCurrency(parseFloat(amount)) + ' ₫';
        });

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount);
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        async function handlePaymentMethodChange() {
            const method = document.getElementById('paymentMethod').value;
            const qrSection = document.getElementById('qrSection');

            if (method === 'BANK_TRANSFER') {
                qrSection.classList.add('active');
                await loadQRCode();
            } else {
                qrSection.classList.remove('active');
            }
        }

        async function loadQRCode() {
            try {
                const orderId = document.getElementById('orderId').value;
                const amount = document.getElementById('amount').value;

                // Gọi endpoint từ customer-service để lấy QR code (qua Kong Gateway)
                const customerServiceUrl = `${CUSTOMER_SERVICE_BASE}/api/customers/payments/qr/${orderId}?amount=${amount}`;
                const response = await fetch(customerServiceUrl);
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('QR Code API Error:', errorText);
                    throw new Error('Không thể tạo mã QR: ' + errorText);
                }

                const qrData = await response.json();

                // Hiển thị QR code
                document.getElementById('qrCodeImage').src = qrData.qr_code;

                // Hiển thị thông tin ngân hàng
                document.getElementById('bankInfo').innerHTML = `
                    <div><strong>Số tài khoản:</strong> ${qrData.bank_account}</div>
                    <div><strong>Chủ tài khoản:</strong> ${qrData.account_name || 'PHAN THANH AN'}</div>
                    <div><strong>Ngân hàng:</strong> ${qrData.bank_name}</div>
                    <div><strong>Nội dung:</strong> ${qrData.content}</div>
                `;
            } catch (error) {
                console.error('Error loading QR code:', error);
                document.getElementById('qrSection').innerHTML = `
                    <div style="padding: 20px; background: #ffe0e0; border-radius: 8px; color: #c92a2a;">
                        ❌ Không thể tạo mã QR. Vui lòng thử lại.
                    </div>
                `;
            }
        }

        async function processPayment(event) {
            event.preventDefault();

            const orderId = document.getElementById('orderId').value;
            const customerId = document.getElementById('customerId').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const method = document.getElementById('paymentMethod').value;
            const payerName = document.getElementById('payerName').value.trim();

            if (!method) {
                showMessage('Vui lòng chọn phương thức thanh toán', 'error');
                return;
            }

            try {
                // Tạo payment record trong service-3 (payment-service)
                const paymentData = {
                    orderId: orderId,
                    customerId: customerId,
                    amount: amount,
                    currency: 'VND',
                    method: method
                };

                const response = await fetch(`${API_BASE}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(paymentData)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Lỗi xử lý thanh toán');
                }

                const payment = await response.json();

                // Confirm payment as SUCCESS (trong môi trường thực tế, cần xác nhận từ ngân hàng)
                const confirmResponse = await fetch(`${API_BASE}/${payment.id}/confirm`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        result: 'SUCCESS'
                    })
                });

                if (!confirmResponse.ok) {
                    const errorData = await confirmResponse.json().catch(() => ({}));
                    const errorMsg = errorData.message || errorData.error || 'Lỗi xác nhận thanh toán';
                    console.error('Confirm payment error:', errorMsg, errorData);
                    throw new Error(errorMsg);
                }

                const confirmResult = await confirmResponse.json();
                console.log('Payment confirmed:', confirmResult);

                showMessage('✓ Thanh toán thành công!', 'success');

                // Đợi 2 giây rồi đóng cửa sổ hoặc redirect
                setTimeout(() => {
                    // Nếu được mở từ popup, đóng popup và reload parent
                    if (window.opener) {
                        window.opener.location.reload();
                        window.close();
                    } else {
                        // Nếu không, redirect về dashboard
                        window.location.href = 'customer-dashboard.html';
                    }
                }, 2000);

            } catch (error) {
                console.error('Error processing payment:', error);
                showMessage('Lỗi: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
